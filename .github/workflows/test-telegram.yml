name: Test Telegram

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Test Telegram connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()

          print("Token length:", len(token))
          print("Chat ID length:", len(chat_id))

          getme = requests.get(
              f"https://api.telegram.org/bot{token}/getMe",
              timeout=30
          )

          print("getMe status:", getme.status_code)
          print("getMe response:", getme.text)

          getme.raise_for_status()

          send = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": "✅ Test GitHub Actions → Telegram thành công"
              },
              timeout=30
          )

          print("sendMessage status:", send.status_code)
          print("sendMessage response:", send.text)

          send.raise_for_status()

          print("Telegram test completed successfully")
          PY
