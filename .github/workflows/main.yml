name: Run FairValue Screening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Run valuation and screening
        run: |
          python main.py --batch-file tickers.txt --output batch_output

      - name: Prepare published reports
        run: |
          mkdir -p published
          cp batch_output/market_report.csv published/market_report.csv
          cp batch_output/telegram_report.json published/telegram_report.json
          cp batch_output/telegram_report.txt published/telegram_report.txt

      - name: Publish reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add published/

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update FairValue screening report"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = Path("batch_output/telegram_report.txt").read_text(
              encoding="utf-8"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          max_len = 3900
          chunks = [
              text[i:i + max_len]
              for i in range(0, len(text), max_len)
          ]

          for chunk in chunks:
              response = requests.post(
                  url,
                  data={
                      "chat_id": chat_id,
                      "text": chunk
                  },
                  timeout=30
              )
              response.raise_for_status()

          print(f"Sent {len(chunks)} Telegram message(s)")
          PY

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fairvalue-report
          path: |
            batch_output/market_report.csv
            batch_output/telegram_report.json
            batch_output/telegram_report.txt
            batch_output/batch_summary.csv
            batch_output/batch_summary.json
            batch_output/error_groups.json
            batch_output/warning_groups.json
